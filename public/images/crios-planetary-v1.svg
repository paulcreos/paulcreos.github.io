<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Críos before a deep red planet</title>
  <desc id="desc">The Críos symbol floats in front of a vast, dark crimson planet.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080506"/>
      <stop offset=".5" stop-color="#1b090d"/>
      <stop offset="1" stop-color="#030203"/>
    </linearGradient>
    <radialGradient id="planet" cx="39%" cy="34%" r="66%">
      <stop stop-color="#9c3430"/>
      <stop offset=".36" stop-color="#76201f"/>
      <stop offset=".73" stop-color="#3c0c12"/>
      <stop offset="1" stop-color="#140307"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop stop-color="#d6624a" stop-opacity=".35"/>
      <stop offset=".72" stop-color="#8c1e23" stop-opacity=".08"/>
      <stop offset="1" stop-color="#5b1119" stop-opacity="0"/>
    </radialGradient>
    <filter id="texture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .028" numOctaves="3" seed="16" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values=".7 0 0 0 .3  0 .12 0 0 .02  0 0 .1 0 .02  0 0 0 .27 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="markGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#050101" flood-opacity=".85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#f5cf9c" flood-opacity=".18"/>
    </filter>
    <clipPath id="planetClip"><circle cx="826" cy="458" r="402"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#space)"/>
  <circle cx="826" cy="458" r="490" fill="url(#halo)"/>
  <circle cx="826" cy="458" r="402" fill="url(#planet)"/>
  <g clip-path="url(#planetClip)" opacity=".46" filter="url(#texture)">
    <ellipse cx="730" cy="350" rx="520" ry="120" fill="#d3553b" opacity=".17" transform="rotate(-18 730 350)"/>
    <ellipse cx="960" cy="570" rx="440" ry="90" fill="#150208" opacity=".45" transform="rotate(19 960 570)"/>
    <path d="M315 468c280-148 712-188 1041-19" fill="none" stroke="#e26849" stroke-opacity=".18" stroke-width="42"/>
  </g>
  <circle cx="826" cy="458" r="402" fill="none" stroke="#c9493b" stroke-opacity=".5" stroke-width="3"/>
  <image href="/images/crios-logo.svg" x="430" y="90" width="790" height="790" filter="url(#markGlow)"/>
</svg>
